<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cena de Natal Animada</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background">
    <div class="logo-if"><img src="Img/Emblema_2026_C.png" alt="Logo IF"></div>
    <div class="fairy-lights">
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
    </div>
    <div class="reindeers">
      <img src="Img/pngtree-cartoon-cute-christmas-reindeer-vector-png-image_16004727.png" alt="Rena voando 1" class="reindeer r1">
      <img src="Img/pngtree-cartoon-cute-christmas-reindeer-vector-png-image_16004727.png" alt="Rena voando 2" class="reindeer r2">
    </div>
    <div class="tree-container">
      <img src="Img/Árvore.webp" alt="Árvore de Natal" class="tree-img">
      <div class="ornaments">
        <img src="Img/Bola bonitinha dourada.webp" alt="Bola Dourada" class="ball b1">
        <img src="Img/Bola Cesio132 pq na verdatchi eh ciana.png" alt="Bola Azul Floco" class="ball b2">
        <img src="Img/Bola Cesio137.webp" alt="Bola Azul Glitter" class="ball b3">
        <img src="Img/Bola dlç.png" alt="Bola Vermelha" class="ball b4">
        <img src="Img/Bola verdinha palmeiras sem mundial.webp" alt="Bola Verde Laço" class="ball b5">
        <img src="Img/Bolona gostosa.webp" alt="Bola Vermelha Floco" class="ball b6">
      </div>
    </div>
  </div>
</body>
</html>
